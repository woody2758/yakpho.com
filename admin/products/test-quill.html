<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Quill Editor</title>

    <!-- Quill CSS -->
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .editor-container {
            margin: 20px 0;
        }

        #editor {
            min-height: 200px;
            background: white;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            margin-top: 20px;
            padding: 10px;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <h1>🧪 Test Quill Editor</h1>

    <div class="editor-container">
        <h3>Editor:</h3>
        <div id="editor"></div>
    </div>

    <div>
        <h3>HTML Output:</h3>
        <textarea id="output" readonly></textarea>
    </div>

    <!-- Quill JS -->
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script>
        console.log('Quill loaded:', typeof Quill !== 'undefined');

        // Initialize Quill
        const quill = new Quill('#editor', {
            theme: 'snow',
            placeholder: 'พิมพ์ข้อความที่นี่...',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'color': [] }, { 'background': [] }],
                    [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                    [{ 'align': [] }],
                    ['link'],
                    ['clean']
                ]
            }
        });

        console.log('Quill initialized:', quill);

        // Update output when content changes
        quill.on('text-change', function () {
            document.getElementById('output').value = quill.root.innerHTML;
        });

        // Set initial content
        quill.root.innerHTML = '<p>ทดสอบ <strong>ตัวหนา</strong> และ <em>ตัวเอียง</em></p>';
        document.getElementById('output').value = quill.root.innerHTML;
    </script>
</body>

</html>
